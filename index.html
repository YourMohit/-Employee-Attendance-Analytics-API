    <script>
      // When hosted on GitHub Pages root without build server, auto-route to compiled /docs
      if (window.location.hostname.endsWith('github.io')) {
        var p = window.location.pathname;
        if (!p.includes('/docs')) {
          if (!p.endsWith('/')) p += '/';
          window.location.replace(p + 'docs/');
        }
      }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-sans selection:bg-indigo-500 selection:text-white">

  </body>
